<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Career Connect — job tracker and resume tailoring</title>
    <meta
      name="description"
      content="A job application tracker that keeps every application in one place, rewrites your resume for the job in front of you, and tells you honestly how you stack up."
    />
    <link rel="canonical" href="https://careerconnectapp.com/" />

    <!--
      What a pasted link looks like in LinkedIn, Slack or a message. Absolute
      URLs are required: crawlers don't resolve relative paths, and og.png is
      regenerated from og-source.svg (see README) rather than hand-drawn.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Career Connect" />
    <meta property="og:title" content="Stop rewriting your resume for every job" />
    <meta
      property="og:description"
      content="Track every application. Tailor every resume to the posting. Get an honest read on where you stand."
    />
    <meta property="og:url" content="https://careerconnectapp.com/" />
    <meta property="og:image" content="https://careerconnectapp.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Career Connect — stop rewriting your resume for every job" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stop rewriting your resume for every job" />
    <meta
      name="twitter:description"
      content="Track every application. Tailor every resume to the posting. Get an honest read on where you stand."
    />
    <meta name="twitter:image" content="https://careerconnectapp.com/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Outside #root so toasts survive the inert attribute an open dialog sets there. -->
    <div id="toaster"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
